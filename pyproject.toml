[project]
name = "plataforma-avaliacao-llms"
version = "0.2.0"
description = "Plataforma de avaliação de LLMs com LLM como juiz e detecção de regressão (Tema 3)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/app.py"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Dados do dataset e texto do prompt do juiz: linhas longas por natureza.
"eval/gerar_casos.py" = ["E501"]
"src/judge.py" = ["E501"]
