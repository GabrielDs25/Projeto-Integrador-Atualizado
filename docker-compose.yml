# Sobe tudo com um comando:  docker compose up
# Na primeira vez baixa os modelos (alguns GB); depois eles ficam no volume "ollama".
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  baixar-modelos:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELOS: ${MODELOS_AVALIADOS:-gemma3:4b,llama3.2:3b,qwen2.5:3b},${MODELO_JUIZ:-qwen2.5:7b}
    entrypoint: ["sh", "-c", "for m in $$(echo $$MODELOS | tr ',' ' '); do ollama pull $$m || exit 1; done"]
    restart: "no"

  app:
    build: .
    depends_on:
      baixar-modelos:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELOS_AVALIADOS: ${MODELOS_AVALIADOS:-gemma3:4b,llama3.2:3b,qwen2.5:3b}
      MODELO_JUIZ: ${MODELO_JUIZ:-qwen2.5:7b}
      DATABASE_PATH: /app/eval/avaliacoes.db
    ports:
      - "8501:8501"
    volumes:
      - ./eval:/app/eval
      - ./evidencias:/app/evidencias

volumes:
  ollama:
